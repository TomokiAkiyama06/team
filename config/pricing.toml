# Claude API 料金テーブル（USD / 100万トークン）
#
# 出典: Anthropic 公式料金ページ https://platform.claude.com/docs/en/about-claude/pricing
#       （2026-10-20 に照合。料金は改定されることがあるため、導入時と定期的に再確認してください）
#
# input       : 入力トークン（キャッシュ対象外の部分）
# output      : 出力トークン（adaptive thinking の思考トークンも出力として課金される）
# cache_write : プロンプトキャッシュ書き込み（5分TTL。本ボットは 5分TTLのみ使用）
# cache_read  : プロンプトキャッシュ読み出し（キャッシュヒット）
#
# 注意（推定費用と実請求の差の要因）:
# - Claude Haiku 5.5 はプロンプトが 100,000 トークンを超えると高い単価（入力 0.50 / 出力 2.50 等）
#   になります。本ボットの1リクエストは通常 1〜2万トークン程度で、この閾値には達しません。
# - inference_geo="us"（米国内推論）を使うと全単価が 1.1 倍になります。本ボットは指定しません（global）。
# - Batch API・Fast mode の単価は本ボットでは使いません。
#
# CLAUDE_MODEL に設定したモデルがここに無い場合、ボットは起動しません（予算管理ができないため）。
# 表にないモデルが応答した場合（フォールバック等）は、表の最大単価で保守的に計上します。

[models.claude-opus-5-5]
input = 4.00
output = 20.00
cache_write = 5.00
cache_read = 0.20

[models.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_write = 2.50
cache_read = 0.10   # 0.05x（公式の脚注による）

[models.claude-haiku-5-5]   # プロンプト 100,000 トークン以下の単価
input = 0.10
output = 0.50
cache_write = 0.125
cache_read = 0.01

[models.claude-sonnet-5]
input = 2.00
output = 10.00
cache_write = 2.50
cache_read = 0.20

[models.claude-opus-5]
input = 5.00
output = 25.00
cache_write = 6.25
cache_read = 0.50

[models.claude-fable-5-1]
input = 10.00
output = 50.00
cache_write = 12.50
cache_read = 0.25
