[project]
name = "classbot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "anthropic>=1.15.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.0",
    "pymupdf>=1.26,<2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "slack-bolt>=1.30.0",
    "watchdog>=6.0.0",
]

[project.scripts]
classbot = "classbot:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
